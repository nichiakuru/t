name: M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GIT_TERMINAL_PROMPT: 0
      GIT_ASKPASS: /bin/true
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: github-actions

    steps:
      # =========================
      # DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl zip unzip bc bison flex \
            build-essential libssl-dev libelf-dev \
            python3 clang llvm lld

      # =========================
      # CLONE (VALID + NO AUTH PROMPT)
      # =========================
      - name: Clone MIUI Ginkgo Kernel (STABLE)
        run: |
          git -c credential.helper= \
              -c core.askPass= \
              clone --depth=1 -b MiuiR-WIP \
              https://github.com/kutemeikito/android_kernel_xiaomi_ginkgo.git kernel

      # =========================
      # PREP BUILD DIR
      # =========================
      - name: Setup kernel directory
        run: |
          cd kernel
          mkdir -p out

      # =========================
      # DEFCONFIG (MIUI STOCK)
      # =========================
      - name: Load MIUI defconfig
        run: |
          cd kernel
          make O=out ARCH=arm64 ginkgo-stock_defconfig

      # =========================
      # FORCE NON INTERACTIVE FIX
      # =========================
      - name: Fix config (NO PROMPT SAFE MODE)
        run: |
          cd kernel
          yes "" | make O=out ARCH=arm64 olddefconfig

      # =========================
      # BUILD (LLVM ONLY)
      # =========================
      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      # =========================
      # CHECK OUTPUT
      # =========================
      - name: Check output
        run: |
          ls -lah kernel/out/arch/arm64/boot || true

      # =========================
      # ANYKERNEL3 PACK
      # =========================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

      - name: Create flashable zip
        run: |
          cd AnyKernel3
          zip -r9 ../MIUI-Ginkgo-Kernel.zip ./*

      # =========================
      # UPLOAD RESULT
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIUI-Ginkgo-Kernel
          path: MIUI-Ginkgo-Kernel.zip
