name: B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev \
            clang llvm lld \
            zip curl wget

      - name: Clone kernel
        run: |
          git clone --depth=1 -b ginkgo-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      # =========================
      # FIX 1: FORCE CLEAN ENV
      # =========================
      - name: Clean environment
        run: |
          cd kernel
          make mrproper || true

      # =========================
      # FIX 2: USE SAFE DEFCONFIG
      # =========================
      - name: Apply defconfig
        run: |
          cd kernel
          make O=out ARCH=arm64 vendor/ginkgo-perf_defconfig

          # FIX silent crash config
          echo "CONFIG_LITTLE_CPU_MASK=\"0-3\"" >> out/.config
          echo "CONFIG_BIG_CPU_MASK=\"4-7\"" >> out/.config

          make O=out ARCH=arm64 olddefconfig KCONFIG_NONINTERACTIVE=1

      # =========================
      # FIX 3: DISABLE BROKEN DTC PARALLEL BUILD
      # =========================
      - name: Fix DTC build issue
        run: |
          cd kernel

          # paksa dtc single-thread safer build
          export MAKEFLAGS="-j1"

      # =========================
      # KernelSU
      # =========================
      - name: Add KernelSU
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      # =========================
      # BUILD STABLE (clang locked)
      # =========================
      - name: Build kernel
        run: |
          cd kernel

          make -j1 O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error -w"

      # =========================
      # OUTPUT CHECK
      # =========================
      - name: Check output
        run: |
          find kernel/out/arch/arm64/boot -type f || true

      # =========================
      # PACK
      # =========================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || true

      - name: Zip kernel
        run: |
          cd AnyKernel3
          zip -r9 ../KernelSU-Ginkgo.zip ./*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Ginkgo
          path: KernelSU-Ginkgo.zip
