name: B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl zip unzip wget bc bison flex \
            build-essential libssl-dev libelf-dev \
            python3 python3-pip \
            clang lld llvm

      - name: Clone stable kernel (LineageOS ginkgo)
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_xiaomi_ginkgo.git kernel

      - name: Setup build environment
        run: |
          cd kernel
          mkdir -p out

      - name: Export build variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=builder" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

      - name: Generate defconfig (SAFE MODE)
        run: |
          cd kernel
          make O=out ARCH=arm64 ginkgo_defconfig

      - name: Fix config (NO PROMPT / NO FREEZE)
        run: |
          cd kernel
          yes "" | make O=out ARCH=arm64 olddefconfig

      - name: Build kernel (LLVM STABLE)
        run: |
          cd kernel
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Check output
        run: |
          ls -lah kernel/out/arch/arm64/boot || true

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

      - name: Pack flashable zip
        run: |
          cd AnyKernel3
          zip -r9 ../KernelSU-Ginkgo-Stable.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Ginkgo-Stable
          path: KernelSU-Ginkgo-Stable.zip
