name: B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev \
            clang lld llvm \
            zip curl wget

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ginkgo-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      # =========================
      # FIX: FORCE CLEAN DEFCONFIG
      # =========================
      - name: Fix defconfig issue (IMPORTANT)
        run: |
          cd kernel

          # paksa pakai defconfig MIUI yang benar
          export DEFCONFIG=vendor/ginkgo-perf_defconfig

          echo "Using defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 $DEFCONFIG

      # =========================
      # FIX: STOP INTERACTIVE CONFIG LOOP
      # =========================
      - name: Force non-interactive config fix
        run: |
          cd kernel

          echo "CONFIG_LITTLE_CPU_MASK=\"0-3\"" >> out/.config || true
          echo "CONFIG_BIG_CPU_MASK=\"4-7\"" >> out/.config || true

          make O=out ARCH=arm64 olddefconfig KCONFIG_NONINTERACTIVE=1

      # =========================
      # KernelSU
      # =========================
      - name: Add KernelSU
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      # =========================
      # BUILD FIXED
      # =========================
      - name: Build kernel
        run: |
          cd kernel

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1

      # =========================
      # CHECK OUTPUT
      # =========================
      - name: Check Image
        run: |
          find kernel/out/arch/arm64/boot -type f

      # =========================
      # AnyKernel3
      # =========================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || true

      - name: Pack zip
        run: |
          cd AnyKernel3
          zip -r9 ../KernelSU-Ginkgo.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Ginkgo
          path: KernelSU-Ginkgo.zip
