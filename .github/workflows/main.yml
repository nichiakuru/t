name: K

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =========================
      # 1. DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl zip unzip bc bison flex \
            build-essential libssl-dev libelf-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # =========================
      # 2. CLONE KERNEL
      # =========================
      - name: Clone kernel
        run: |
          git clone --depth=1 -b MiuiR-WIP \
          https://github.com/kutemeikito/android_kernel_xiaomi_ginkgo.git kernel

      # =========================
      # 3. ADD KERNELSU
      # =========================
      - name: Add KernelSU
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      # =========================
      # 4. DEFCONFIG (NO INTERACTIVE FIX)
      # =========================
      - name: Defconfig
        run: |
          cd kernel

          # generate base config
          make O=out ARCH=arm64 vendor/ginkgo-stock_defconfig

          # IMPORTANT FIX: remove problematic Kconfig options BEFORE re-eval
          sed -i '/LITTLE_CPU_MASK/d' out/.config || true
          sed -i '/BIG_CPU_MASK/d' out/.config || true

          # force clean re-evaluation without prompts
          yes "" | make O=out ARCH=arm64 oldconfig

      # =========================
      # 5. BUILD
      # =========================
      - name: Build kernel
        run: |
          cd kernel

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # =========================
      # 6. CHECK OUTPUT
      # =========================
      - name: Check output
        run: |
          ls -lah kernel/out/arch/arm64/boot || true

      # =========================
      # 7. ANYKERNEL3
      # =========================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy Image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || true

      # =========================
      # 8. ZIP
      # =========================
      - name: Make zip
        run: |
          cd AnyKernel3
          zip -r9 ../KernelSU-Ginkgo-MIUI.zip ./*

      # =========================
      # 9. UPLOAD
      # =========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Ginkgo-MIUI
          path: KernelSU-Ginkgo-MIUI.zip
