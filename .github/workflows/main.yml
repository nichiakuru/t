name: B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GIT_TERMINAL_PROMPT: 0
      GIT_ASKPASS: /bin/true

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl zip unzip wget bc bison flex \
            build-essential libssl-dev libelf-dev \
            python3 clang llvm lld

      # =========================
      # FIXED CLONE (NO AUTH PROMPT EVER)
      # =========================
      - name: Clone kernel (FORCED NO AUTH MODE)
        run: |
          git -c credential.helper= \
              -c core.askPass= \
              clone --depth=1 -b lineage-18.1 \
              https://github.com/LineageOS/android_kernel_xiaomi_ginkgo.git kernel

      - name: Setup build folder
        run: |
          cd kernel
          mkdir -p out

      - name: Export build env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=github" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=runner" >> $GITHUB_ENV

      # =========================
      # DEFCONFIG SAFE MODE
      # =========================
      - name: Load defconfig
        run: |
          cd kernel
          make O=out ARCH=arm64 ginkgo_defconfig

      - name: Fix kconfig (NO INTERACTIVE LOOP)
        run: |
          cd kernel
          yes "" | make O=out ARCH=arm64 olddefconfig

      # =========================
      # BUILD KERNEL (LLVM ONLY - STABLE)
      # =========================
      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      # =========================
      # CHECK OUTPUT
      # =========================
      - name: Verify output
        run: |
          find kernel/out/arch/arm64/boot -type f || true

      # =========================
      # ANYKERNEL PACKAGING
      # =========================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

      - name: Create flashable zip
        run: |
          cd AnyKernel3
          zip -r9 ../Kernel-Ginkgo-Stable.zip ./*

      # =========================
      # UPLOAD RESULT
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Ginkgo-Stable
          path: Kernel-Ginkgo-Stable.zip
